<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="nexus-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2B3A"/>
      <stop offset="1" stop-color="#1D6FE0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#101C27"/>

  <!-- abstract graph motif, faint -->
  <g stroke="#2A3C4D" stroke-width="1.5" opacity="0.55">
    <path d="M880 120 L1010 210 L960 360 L1090 470"/>
    <path d="M1010 210 L1140 140"/>
    <path d="M960 360 L840 480 L1090 470"/>
  </g>
  <g opacity="0.55">
    <circle cx="880" cy="120" r="7" fill="#374D61"/>
    <circle cx="1010" cy="210" r="9" fill="#1D6FE0" opacity="0.7"/>
    <circle cx="1140" cy="140" r="6" fill="#374D61"/>
    <circle cx="960" cy="360" r="8" fill="#0E9488" opacity="0.7"/>
    <circle cx="840" cy="480" r="6" fill="#374D61"/>
    <circle cx="1090" cy="470" r="9" fill="#56758F"/>
  </g>

  <!-- mark -->
  <g transform="translate(96, 210) scale(2.2)">
