  </g>

  <text x="260" y="300" font-family="'Space Grotesk', Inter, ui-sans-serif, system-ui, sans-serif" font-size="72" font-weight="700" letter-spacing="-2" fill="#FFFFFF">Life Science Nexus</text>
  <text x="262" y="362" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="30" fill="#A3B8C9">Industry &amp; Product Intelligence Graph for Life Science Markets</text>

  <text x="96" y="556" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" letter-spacing="3" fill="#56758F">EVIDENCE-BACKED MARKET INTELLIGENCE</text>
